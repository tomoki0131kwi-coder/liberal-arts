<title>教養日めくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 日めくり暦の一枚（左・固定）＋その日の学び（右・読み物）。曜日の七曜（月火水木金土日）を分野の色に対応させる */
:root {
  --paper: #eef0eb;
  --sheet: #f9faf7;
  --ink: #1c222c;
  --ink-2: #4b5462;
  --rule: #d3d8d0;
  --ai: #2b4a78;          /* 藍：アクセント */
  --ai-soft: #dfe6f1;
  --good: #2f6b45;
  --good-soft: #dcebe0;
  --bad: #9a3324;
  --bad-soft: #f3dfda;
  /* 七曜の色（分野） */
  --c-tsuki: #5d6b85;   /* 月・哲学 */
  --c-hi: #b2452f;      /* 火・歴史 */
  --c-mizu: #1f6f8b;    /* 水・自然科学 */
  --c-ki: #3e7a3f;      /* 木・社会科学 */
  --c-kin: #a07818;     /* 金・芸術 */
  --c-tsuchi: #8a5a3b;  /* 土・言語と文学 */
  --c-nichi: #c0602a;   /* 日・数学と統計 */
  --fc: var(--c-tsuki); /* 表示中の分野の色（JSで切替） */
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161b; --sheet: #1b1f26; --ink: #e5e8e2; --ink-2: #a8afb9; --rule: #2e343d;
    --ai: #8fb0e3; --ai-soft: #233149; --good: #7fc392; --good-soft: #1f3327; --bad: #ec8f7d; --bad-soft: #3d2420;
    --c-tsuki: #a3b0c9; --c-hi: #e88a72; --c-mizu: #6fbfd8; --c-ki: #8cc78a; --c-kin: #e0bb5c; --c-tsuchi: #d1a07f; --c-nichi: #f0a170;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161b; --sheet: #1b1f26; --ink: #e5e8e2; --ink-2: #a8afb9; --rule: #2e343d;
  --ai: #8fb0e3; --ai-soft: #233149; --good: #7fc392; --good-soft: #1f3327; --bad: #ec8f7d; --bad-soft: #3d2420;
  --c-tsuki: #a3b0c9; --c-hi: #e88a72; --c-mizu: #6fbfd8; --c-ki: #8cc78a; --c-kin: #e0bb5c; --c-tsuchi: #d1a07f; --c-nichi: #f0a170;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.9;
  padding-inline: 16px; padding-block: 20px 64px;
}
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

/* masthead */
.mast { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; letter-spacing: .08em; }
.brand small { font-family: var(--f-body); font-weight: 400; font-size: .8rem; letter-spacing: .04em; color: var(--ink-2); margin-left: 12px; }
.mast nav { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 6px 12px; font-size: .88rem; }
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); font-weight: 700; }
.btn[disabled] { opacity: .5; cursor: default; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* 日めくりの一枚 */
aside { display: grid; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 860px) { aside { position: static; } }
.sheet {
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px;
  position: relative; overflow: hidden;
}
.sheet::before { /* 綴じ穴の列 */
  content: ""; display: block; height: 14px; border-bottom: 1px dashed var(--rule);
  background: radial-gradient(circle at 50% 50%, var(--paper) 3px, transparent 3.5px) 0 0 / 22px 14px repeat-x;
}
.sheet-body { padding: 14px 20px 18px; display: grid; gap: 4px; }
.sheet-top { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); letter-spacing: .06em; }
.daynum { font-family: var(--f-display); font-weight: 900; font-size: 6.2rem; line-height: 1; color: var(--fc); font-variant-numeric: tabular-nums; }
.dayrow { display: flex; align-items: center; gap: 12px; }
.youbi { font-family: var(--f-display); font-weight: 700; font-size: 1.8rem; width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border: 2px solid var(--fc); color: var(--fc); border-radius: 50%; }
.fieldname { font-weight: 700; font-size: 1rem; }
.fieldname span { display: block; font-weight: 400; font-size: .78rem; color: var(--ink-2); }
.sheet-note { font-size: .8rem; color: var(--ink-2); border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 8px; }

.panel h3 { font-family: var(--f-body); font-size: .75rem; letter-spacing: .12em; color: var(--ink-2); font-weight: 500; margin-bottom: 8px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { border: 1px solid var(--rule); background: var(--sheet); border-radius: 4px; padding: 6px 0 4px; display: grid; justify-items: center; gap: 2px; font-size: .7rem; color: var(--ink-2); position: relative; }
.wd b { font-family: var(--f-display); font-size: 1.05rem; color: var(--fc); }
.wd.today { border-color: var(--fc); box-shadow: inset 0 -3px 0 var(--fc); }
.wd.sel { background: var(--ai-soft); }
.wd .mark { height: 1em; font-size: .7rem; color: var(--good); }

.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.clock { font-family: var(--f-mono); font-size: 1.9rem; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ai); width: 0; transition: width .5s linear; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 12px; }
.stat b { font-family: var(--f-mono); font-size: 1.4rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.3; }
.stat span { font-size: .75rem; color: var(--ink-2); }

/* 本文 */
main { display: grid; gap: 40px; min-width: 0; }
.lesson-head { display: grid; gap: 10px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .8rem; color: var(--ink-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 700; color: var(--fc); border: 1px solid var(--fc); }
.lesson-head h1 { font-size: clamp(1.7rem, 4.4vw, 2.6rem); font-weight: 900; }
.lead { font-family: var(--f-display); font-size: 1.12rem; color: var(--ink-2); max-width: 40em; }
.plan { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--sheet); width: fit-content; max-width: 100%; }
.plan a { padding: 6px 12px; font-size: .8rem; color: var(--ink); text-decoration: none; border-right: 1px solid var(--rule); white-space: nowrap; }
.plan a:last-child { border-right: 0; }
.plan a b { font-family: var(--f-mono); font-weight: 500; color: var(--ai); margin-right: 4px; }

section.step { display: grid; gap: 14px; scroll-margin-top: 16px; }
.step-h { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.step-h .n { font-family: var(--f-mono); font-size: .85rem; color: var(--fc); }
.step-h h2 { font-size: 1.3rem; }
.step-h .min { margin-left: auto; font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); white-space: nowrap; }
.prose { display: grid; gap: 1em; max-width: 40em; font-size: 1.02rem; }
.prose b { font-weight: 700; background: linear-gradient(transparent 62%, var(--ai-soft) 62%); }

.interp { max-width: 40em; border: 1px dashed var(--ink-2); border-radius: 4px; padding: 12px 16px; display: grid; gap: 8px; font-size: .94rem; }
.interp-h { font-size: .75rem; letter-spacing: .1em; font-weight: 700; color: var(--ink-2); }
.interp ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

figure.quote { margin: 0; max-width: 40em; display: grid; gap: 10px; }
.quote blockquote { margin: 0; font-family: var(--f-display); font-size: 1.22rem; line-height: 2; padding: 18px 22px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--fc); }
.quote .orig { font-family: var(--f-mono); font-size: .82rem; color: var(--ink-2); line-height: 1.7; }
.quote figcaption { font-size: .82rem; color: var(--ink-2); }
.quote figcaption b { color: var(--ink); }
.qtype { font-size: .72rem; border: 1px solid var(--rule); padding: 0 6px; border-radius: 3px; margin-right: 6px; }

.quiz { display: grid; gap: 22px; max-width: 40em; }
.q { display: grid; gap: 8px; }
.q p.qt { font-weight: 700; }
.choices { display: grid; gap: 6px; }
.choice { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 8px 12px; line-height: 1.6; }
.choice:hover:not([disabled]) { border-color: var(--ai); }
.choice[disabled] { cursor: default; }
.choice.ok { background: var(--good-soft); border-color: var(--good); }
.choice.ng { background: var(--bad-soft); border-color: var(--bad); }
.exp { font-size: .9rem; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 10px; }
.exp strong { color: var(--ink); }
.score { font-family: var(--f-mono); font-size: .85rem; color: var(--ink-2); }

.think { font-family: var(--f-display); font-size: 1.15rem; max-width: 36em; }
textarea, input[type="text"] {
  width: 100%; max-width: 40em; font: inherit; font-size: .95rem; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; line-height: 1.7;
}
textarea { min-height: 7em; resize: vertical; }
.hint { font-size: .78rem; color: var(--ink-2); }

.ask { display: grid; gap: 10px; max-width: 40em; }
.ask-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ask-row input { flex: 1 1 16em; min-width: 0; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: .8rem; }
.suggest button:hover { border-color: var(--ai); }
.answer { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px; font-size: .95rem; min-height: 3em; }
.answer:empty { display: none; }

.sources ol { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: .9rem; max-width: 46em; }
.sources li span { color: var(--ink-2); font-size: .82rem; }

.finish { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 18px 20px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; }
.finish p { flex: 1 1 18em; font-size: .92rem; color: var(--ink-2); }
.done-badge { font-weight: 700; color: var(--good); }

/* 全14回 */
.library { display: grid; gap: 14px; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lib-item { text-align: left; background: var(--sheet); border: 1px solid var(--rule); border-top: 3px solid var(--fc); border-radius: 4px; padding: 10px 14px 12px; display: grid; gap: 2px; }
.lib-item:hover { border-color: var(--ai); border-top-color: var(--fc); }
.lib-item .meta { display: flex; justify-content: space-between; font-size: .74rem; color: var(--ink-2); }
.lib-item .t { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.5; }
.lib-item.cur { outline: 2px solid var(--ai); outline-offset: -2px; }
.lib-item .ok { color: var(--good); font-weight: 700; }

footer { font-size: .78rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 12px; max-width: 60em; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 480px) { .daynum { font-size: 4.8rem; } .quote blockquote { font-size: 1.08rem; padding: 14px 16px; } }
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">教養日めくり<small>一日十五分、七つの分野をめぐる</small></div>
    <nav aria-label="日付の移動">
      <button class="btn" id="prevBtn" type="button">← 前の回</button>
      <button class="btn" id="todayBtn" type="button">今日</button>
      <button class="btn" id="nextBtn" type="button">次の回 →</button>
    </nav>
  </header>

  <div class="layout">
    <aside>
      <div class="sheet" id="sheet">
        <div class="sheet-body">
          <div class="sheet-top"><span id="sYear"></span><span id="sCycle"></span></div>
          <div class="daynum" id="sDay"></div>
          <div class="dayrow">
            <div class="youbi" id="sYoubi"></div>
            <div class="fieldname" id="sField"></div>
          </div>
          <p class="sheet-note" id="sNote"></p>
        </div>
      </div>

      <div class="panel">
        <h3>七曜と分野</h3>
        <div class="week" id="week"></div>
      </div>

      <div class="panel">
        <h3>十五分タイマー</h3>
        <div class="timer">
          <span class="clock" id="clock">15:00</span>
          <button class="btn" id="timerBtn" type="button">開始</button>
          <button class="btn" id="timerReset" type="button">戻す</button>
        </div>
        <div class="bar" aria-hidden="true"><i id="timerBar"></i></div>
      </div>

      <div class="panel">
        <h3>あなたの記録（この端末）</h3>
        <div class="stats">
          <div class="stat"><b id="stStreak">0</b><span>連続日数</span></div>
          <div class="stat"><b id="stDone">0 / 14</b><span>読み終えた回</span></div>
        </div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <section class="library" aria-labelledby="libH">
    <div class="step-h"><h2 id="libH">全十四回</h2><span class="min">二週間でひと巡り</span></div>
    <div class="lib-grid" id="lib"></div>
  </section>

  <footer>
    各回の本文は、末尾の「出典」に挙げた原典と標準的な研究書にもとづいて書いています。原典に書かれていることは本文に、後世の解釈・諸説・推測は点線の囲み「解釈・諸説」に分けて示しました。引用の和訳のうち「拙訳」とあるものは本ページ独自の訳です。学習の記録とメモはこの端末のブラウザにだけ保存されます。
  </footer>
</div>

<script>
const FIELDS = {
  phil:  { name: "哲学",       en: "Philosophy",       youbi: "月", c: "--c-tsuki" },
  hist:  { name: "歴史",       en: "History",          youbi: "火", c: "--c-hi" },
  sci:   { name: "自然科学",   en: "Natural Science",  youbi: "水", c: "--c-mizu" },
  soc:   { name: "社会科学",   en: "Social Science",   youbi: "木", c: "--c-ki" },
  art:   { name: "芸術",       en: "Arts",             youbi: "金", c: "--c-kin" },
  lit:   { name: "言語と文学", en: "Language & Letters", youbi: "土", c: "--c-tsuchi" },
  math:  { name: "数学と統計", en: "Mathematics",      youbi: "日", c: "--c-nichi" }
};
const ORDER = ["phil", "hist", "sci", "soc", "art", "lit", "math"]; // 月〜日

const LESSONS = [
/* ───── 第一週 ───── */
{
  id: "plato-cave", field: "phil",
  title: "洞窟の比喩：影を実在と思い込む私たち",
  lead: "プラトンは、教育とは知識を注ぎ込むことではなく、魂の向きを変えることだと語った。",
  body: [
    "古代ギリシアの哲学者プラトン（前427頃〜前347）の対話篇『国家』第7巻の冒頭で、ソクラテスは一つの情景を描きます。地下の洞窟に、子どものころから手足と首を縛られ、奥の壁しか見ることのできない人々がいる。背後の高いところでは火が燃えていて、火と囚人のあいだには低い壁がある。その壁の上を、人や動物をかたどった器物が運ばれていく。",
    "囚人たちが見られるのは、器物が壁に落とす<b>影</b>だけです。彼らは影こそが実在だと考え、どの影が先に現れるかを言い当てる腕前を競い合っています。",
    "あるとき一人が縛めを解かれ、振り返らされます。火の光で目が痛み、さっきまでの影のほうがよほど確かに見える。さらに急な坂を洞窟の外へ引きずり出されると、まばゆさで何も見えません。目が慣れるにつれ、彼はまず影を、次に水に映る像を、それから事物そのものを見られるようになり、夜には月と星を、そして最後に<b>太陽そのもの</b>を見ることができるようになります。",
    "この人が洞窟へ戻ると、今度は暗さに目が慣れず、影の当てっこで負けてしまいます。囚人たちは「上へ行って目をだめにして帰ってきた」と笑い、自分たちを解き放って上へ連れて行こうとする者がいれば、捕まえて殺すだろう、とソクラテスは語ります。",
    "比喩の意味は本文でソクラテス自身が説明しています。洞窟の住まいは視覚を通して現れる世界、火の光は太陽の力、上への道のりは魂が知性によって知られる世界へと昇っていくこと。そして最後にかろうじて見られるのが<b>「善のイデア」</b>です。この比喩は、第6巻の「太陽の比喩」「線分の比喩」に続く三つめの比喩として置かれています。",
    "続く箇所でソクラテスは教育観を述べます。教育とは、見る力を持たない魂に知識を外から入れることではない。誰の魂にも学ぶ力はすでにあり、教育とはその力を正しい方向へ<b>向け変える技術</b>なのだ、と。"
  ],
  interp: [
    "解放者を「殺すだろう」という一節は、前399年のソクラテス刑死を暗示したものと読むのが一般的です。ただし本文にそう明記されているわけではありません。",
    "現代では、メディアや SNS が見せる「影」の比喩として引かれることがあります。これは後世の応用で、プラトン自身の意図（イデア論）とは別のものです。"
  ],
  quote: {
    type: "引用（拙訳）",
    text: "では次に、教育を受けることと受けないことに関して、われわれの本性がどのような状態にあるかを、次のような有様になぞらえてみてほしい。",
    orig: "『国家』514A",
    note: "比喩の書き出しの一文。プラトンがこの比喩を「教育」の話として始めていることに注目してください。"
  },
  quiz: [
    { q: "洞窟の囚人たちが「実在」だと思っているものは何か。", c: ["壁に映る影", "背後で燃える火", "洞窟の外の景色"], a: 0, e: "囚人は振り向けないため、器物が壁に落とす影しか見たことがありません（514B–515C）。" },
    { q: "洞窟の外へ出た人が、最後に見られるようになるものは。", c: ["水面に映る像", "太陽そのもの", "夜空の星"], a: 1, e: "影 → 水面の像 → 事物 → 月と星 → 太陽、の順に目が慣れていきます（516A–B）。" },

const EPOCH = Date.UTC(2024, 0, 1); // 2024-01-01 は月曜日
const DAY = 86400000;
function localDayStamp(d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }
function isoOf(stamp) { return new Date(stamp).toISOString().slice(0, 10); }
function lessonIndexFor(stamp) {
  const days = Math.floor((stamp - EPOCH) / DAY);
  const week = Math.floor(days / 7);
  const dow = ((days % 7) + 7) % 7;              // 0 = 月
  const cycle = ((week % 2) + 2) % 2;            // 0 = 第一週, 1 = 第二週
  return cycle * 7 + dow;
}
const TODAY = localDayStamp(new Date());
let viewStamp = TODAY;

/* ───── この端末の記録（localStorage は失敗しうるので必ず try） ───── */
const KEY = "kyoyo-himekuri.v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { done: {}, days: [], notes: {} }; } catch { return { done: {}, days: [], notes: {} }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }
const store = load();
store.done ||= {}; store.days ||= []; store.notes ||= {};

function streak() {
  const set = new Set(store.days);
  let s = 0, t = TODAY;
  if (!set.has(isoOf(t))) t -= DAY;               // 今日まだでも昨日まで続いていれば数える
  while (set.has(isoOf(t))) { s++; t -= DAY; }
  return s;
}

/* ───── 描画 ───── */
const $ = (id) => document.getElementById(id);
const YOUBI = ["月", "火", "水", "木", "金", "土", "日"];
const KANJI_NUM = ["〇","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四"];

function render() {
  const idx = lessonIndexFor(viewStamp);
  const L = LESSONS[idx];
  const F = FIELDS[L.field];
  const d = new Date(viewStamp);
  const dow = idx % 7;
  document.documentElement.style.setProperty("--fc", `var(${F.c})`);

  $("sYear").textContent = `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月`;
  $("sCycle").textContent = `第${idx < 7 ? "一" : "二"}週・第${KANJI_NUM[idx + 1]}回`;
  $("sDay").textContent = d.getUTCDate();
  $("sYoubi").textContent = YOUBI[dow];
  $("sField").innerHTML = `${F.name}<span>${F.en}</span>`;
  $("sNote").textContent = viewStamp === TODAY ? "今日の一枚です。" :
    `${viewStamp < TODAY ? "過去" : "先"}の日付の回を表示しています。`;

  // 七曜
  const monday = viewStamp - dow * DAY;
  $("week").innerHTML = ORDER.map((k, i) => {
    const st = monday + i * DAY;
    const li = LESSONS[lessonIndexFor(st)];
    const cls = ["wd", st === TODAY ? "today" : "", st === viewStamp ? "sel" : ""].join(" ");
    return `<button type="button" class="${cls}" style="--fc:var(${FIELDS[k].c})" data-stamp="${st}" title="${li.title}">
      <b>${YOUBI[i]}</b>${FIELDS[k].name.slice(0, 2)}<span class="mark">${store.done[li.id] ? "済" : ""}</span></button>`;
  }).join("");

  $("stStreak").textContent = streak();
  $("stDone").textContent = `${Object.keys(store.done).length} / 14`;

  renderLesson(L, F);
  renderLibrary(idx);
}

function renderLesson(L, F) {
  const done = store.done[L.id];
  $("main").innerHTML = `
  <div class="lesson-head">
    <div class="eyebrow"><span class="chip">${F.youbi}曜・${F.name}</span><span>読む・原典・確かめる・考える　計15分</span></div>
    <h1>${L.title}</h1>
    <p class="lead">${L.lead}</p>
    <nav class="plan" aria-label="今日の流れ">
      <a href="#s-read"><b>6分</b>読む</a><a href="#s-quote"><b>2分</b>原典</a><a href="#s-quiz"><b>3分</b>確かめる</a><a href="#s-think"><b>4分</b>考える</a>
    </nav>
  </div>

  <section class="step" id="s-read">
    <div class="step-h"><span class="n">1</span><h2>読む</h2><span class="min">6分</span></div>
    <div class="prose">${L.body.map(p => `<p>${p}</p>`).join("")}</div>
    <div class="interp">
      <div class="interp-h">解釈・諸説（原典に明記されていない内容）</div>
      <ul>${L.interp.map(x => `<li>${x}</li>`).join("")}</ul>
    </div>
  </section>

  <section class="step" id="s-quote">
    <div class="step-h"><span class="n">2</span><h2>原典にふれる</h2><span class="min">2分</span></div>
    <figure class="quote">
      <blockquote>${L.quote.text}</blockquote>
      <div class="orig"><span class="qtype">${L.quote.type}</span>${L.quote.orig}</div>
      <figcaption>${L.quote.note}</figcaption>
    </figure>
  </section>

  <section class="step" id="s-quiz">
    <div class="step-h"><span class="n">3</span><h2>確かめる</h2><span class="min">3分</span></div>
    <div class="quiz" id="quiz">
      ${L.quiz.map((q, qi) => `
        <div class="q" data-qi="${qi}">
          <p class="qt">問${qi + 1}　${q.q}</p>
          <div class="choices">${q.c.map((c, ci) => `<button type="button" class="choice" data-ci="${ci}">${c}</button>`).join("")}</div>
          <p class="exp" hidden></p>
        </div>`).join("")}
      <p class="score" id="score">3問中 0問 回答済み</p>
    </div>
  </section>

  <section class="step" id="s-think">
    <div class="step-h"><span class="n">4</span><h2>考える</h2><span class="min">4分</span></div>
    <p class="think">${L.think}</p>
    <textarea id="note-${L.id}" aria-label="考えたことのメモ" placeholder="思いついたことを数行で。">${escapeHtml(store.notes[L.id] || "")}</textarea>
    <p class="hint">メモはこの端末のブラウザにだけ保存されます。</p>
  </section>

  <section class="step" id="s-ask" hidden>
    <div class="step-h"><span class="n">＋</span><h2>Claude と深める</h2><span class="min">任意</span></div>
    <div class="ask">
      <div class="suggest" id="suggest">
        <button type="button">もう少し詳しく</button>
        <button type="button">反対の立場や批判は？</button>
        <button type="button">現代とのつながりは？</button>
        <button type="button">次に読むべき原典は？</button>
      </div>
      <div class="ask-row">
        <input type="text" id="askInput" placeholder="この回について質問する" aria-label="Claude への質問">
        <button type="button" class="btn primary" id="askBtn">質問する</button>
        <button type="button" class="btn" id="stopBtn" hidden>止める</button>
      </div>
      <div class="answer" id="answer" aria-live="polite"></div>
      <p class="hint" id="askHint">回答には原典を示し、推測は【推測】と明記するよう Claude に依頼します。回答は誤りを含むことがあるため、示された原典で確かめてください。質問はあなたの Claude の利用枠を使います。</p>
    </div>
  </section>

  <section class="step sources">
    <div class="step-h"><h2>出典</h2></div>
    <ol>${L.sources.map(([a, b]) => `<li>${a}${b ? `<br><span>${b}</span>` : ""}</li>`).join("")}</ol>
  </section>

  <div class="finish">
    <p>${done ? `<span class="done-badge">読了済み（${done}）</span>　もう一度読み返すのも良い復習です。` : "4つのステップを終えたら、今日の一枚をめくりましょう。"}</p>
    <button type="button" class="btn primary" id="doneBtn">${done ? "記録を取り消す" : "今日の一枚をめくる"}</button>
  </div>`;

  // クイズ
  let answered = 0;
  $("main").querySelectorAll(".q").forEach(qEl => {
    const q = L.quiz[+qEl.dataset.qi];
    qEl.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
      const ci = +b.dataset.ci;
      qEl.querySelectorAll(".choice").forEach((x, i) => {
        x.disabled = true;
        if (i === q.a) x.classList.add("ok");
        else if (i === ci) x.classList.add("ng");
      });
      const exp = qEl.querySelector(".exp");
      exp.innerHTML = `<strong>${ci === q.a ? "正解。" : "正解は「" + q.c[q.a] + "」。"}</strong>${q.e}`;
      exp.hidden = false;
      answered++;
      $("score").textContent = `3問中 ${answered}問 回答済み`;
    }));
  });

  // メモ
  const ta = $("note-" + L.id);
  ta.addEventListener("input", () => { store.notes[L.id] = ta.value; save(); });

  // 読了
  $("doneBtn").addEventListener("click", () => {
    if (store.done[L.id]) { delete store.done[L.id]; }
    else {
      store.done[L.id] = isoOf(TODAY);
      if (!store.days.includes(isoOf(TODAY))) store.days.push(isoOf(TODAY));
    }
    save(); render();
  });

  setupAsk(L, F);
}

function renderLibrary(cur) {
  $("lib").innerHTML = LESSONS.map((L, i) => {
    const F = FIELDS[L.field];
    return `<button type="button" class="lib-item ${i === cur ? "cur" : ""}" style="--fc:var(${F.c})" data-i="${i}">
      <span class="meta"><span>第${i < 7 ? "一" : "二"}週 ${F.youbi}曜・${F.name}</span><span class="ok">${store.done[L.id] ? "読了" : ""}</span></span>
      <span class="t">${L.title}</span></button>`;
  }).join("");
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ───── 移動 ───── */
function go(stamp) { viewStamp = stamp; render(); window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
$("prevBtn").addEventListener("click", () => go(viewStamp - DAY));
$("nextBtn").addEventListener("click", () => go(viewStamp + DAY));
$("todayBtn").addEventListener("click", () => go(TODAY));
$("week").addEventListener("click", e => { const b = e.target.closest("[data-stamp]"); if (b) go(+b.dataset.stamp); });
$("lib").addEventListener("click", e => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  // 選んだ回が今日以前で最も近く現れる日へ移動
  const want = +b.dataset.i;
  let s = TODAY;
  for (let k = 0; k < 14; k++) { if (lessonIndexFor(TODAY - k * DAY) === want) { s = TODAY - k * DAY; break; } }
  go(s);
});

/* ───── 十五分タイマー ───── */
const TOTAL = 15 * 60;
let left = TOTAL, tick = null;
function drawTimer() {
  $("clock").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  $("timerBar").style.width = `${(1 - left / TOTAL) * 100}%`;
}
$("timerBtn").addEventListener("click", () => {
  if (tick) { clearInterval(tick); tick = null; $("timerBtn").textContent = "再開"; return; }
  if (left === 0) left = TOTAL;
  $("timerBtn").textContent = "一時停止";
  tick = setInterval(() => {
    left = Math.max(0, left - 1); drawTimer();
    if (left === 0) { clearInterval(tick); tick = null; $("timerBtn").textContent = "もう一度"; $("clock").textContent = "おつかれさま"; }
  }, 1000);
});
$("timerReset").addEventListener("click", () => { clearInterval(tick); tick = null; left = TOTAL; $("timerBtn").textContent = "開始"; drawTimer(); });

/* ───── Claude と深める（sample 機能。使えない環境では欄ごと隠す） ───── */
let samplePromise = window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let askDisabled = false;
let ctl = null;

function lessonText(L) {
  const strip = s => s.replace(/<[^>]+>/g, "");
  return [
    `題：${L.title}`,
    `本文：${L.body.map(strip).join(" ")}`,
    `解釈・諸説：${L.interp.map(strip).join(" ")}`,
    `出典：${L.sources.map(s => s[0]).join("／")}`
  ].join("\n");
}

async function setupAsk(L, F) {
  const sample = await samplePromise;
  const sec = $("s-ask");
  if (!sample || askDisabled || !sec) return;
  sec.hidden = false;
  const input = $("askInput"), btn = $("askBtn"), stop = $("stopBtn"), out = $("answer");

  async function ask(question) {
    if (!question.trim()) { input.focus(); return; }
    ctl?.abort();
    ctl = new AbortController();
    btn.disabled = true; stop.hidden = false;
    out.textContent = "考えています…";
    const prompt =
`あなたは教養講座の講師です。以下は学習者が今日読んだ「${F.name}」分野の短い教材です。

${lessonText(L)}

学習者の質問：${question}

回答の条件：
- 日本語で、400〜600字程度。見出しや Markdown 記号は使わず、段落で書く。
- 事実を述べるときは、その根拠となる原典（著作名・章や条文・論文名と年など）を具体的に示す。
- 原典から推測した内容、または原典がなく推測するしかない内容は、文頭に【推測】と付け、原典にもとづく記述とは段落を分ける。
- 確信のない固有名詞・年・数値は書かない。
- 最後に「次に読むなら」として原典を1〜2点挙げる。`;
    try {
      await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
    } catch (e) {
      out.textContent = e?.text ?? "";
      const msg = {
        not_granted: "Claude への質問が許可されなかったため、この欄を閉じました。",
        rate_limited: "質問が続いたため、少し時間をおいてからもう一度どうぞ。",
        cancelled: ""
      }[e?.code] ?? "回答を受け取れませんでした。時間をおいて、もう一度質問してください。";
      if (e?.code === "not_granted") { askDisabled = true; sec.hidden = true; }
      if (msg) $("askHint").textContent = msg;
    } finally {
      btn.disabled = false; stop.hidden = true;
    }
  }
  btn.addEventListener("click", () => ask(input.value));
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) ask(input.value); });
  stop.addEventListener("click", () => ctl?.abort());
  $("suggest").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    input.value = b.textContent; ask(b.textContent);
  });
}

drawTimer();
render();
</script>
